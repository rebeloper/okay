name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # jq ships on ubuntu-latest; bats does not.
      - run: npm install -g bats
      - run: npm test
      - run: npm run test:bats
